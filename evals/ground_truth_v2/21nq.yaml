pdb: 21NQ
short_name: "Human SLC37A4 (glucose-6-phosphate exchanger) — apo state"
description: |
  Cryo-EM structure (2.8 Å) of human SLC37A4 in the apo (substrate-free)
  state. SLC37A4 is the endoplasmic reticulum glucose-6-phosphate
  exchanger that couples cytoplasmic G6P import into the ER lumen with
  inorganic-phosphate (Pi) export — the rate-limiting step in
  gluconeogenesis / glycogenolysis. Loss-of-function mutations cause
  glycogen storage disease type Ib. SLC37A4 is a 10–12 transmembrane-helix
  Major Facilitator Superfamily (MFS) antiporter, structurally analogous
  to other sugar-phosphate exchangers (UhpT, GlpT). This apo entry has NO
  ligand bound — it tests Claude's discipline against fabricating
  cofactors / substrates when the structure shows none.

