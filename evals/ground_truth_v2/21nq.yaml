    - "glucose-6-phosphate"
    - "G6P"
    - "MFS"
    - "ER"
    - "endoplasmic reticulum"
  reference_phrase: "SLC37A4 — ER glucose-6-phosphate / Pi exchanger; MFS antiporter; mutated in glycogen storage disease type Ib"

