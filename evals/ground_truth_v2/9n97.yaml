pdb: 9N97
short_name: "Cysteine-free anti-UTag intrabody (scFv) for live-cell mRNA translation tracking"
description: |
  Crystal structure (1.43 Å) of an engineered **cysteine-free, thermostable
  single-chain variable fragment (scFv) intrabody** that recognizes the
  UTag peptide tag — a recently developed system for tracking single mRNA
  translation events in living cells. The intrabody is built on a
  conventional VH-linker-VL scFv scaffold but with all native cysteines
  removed (replaced with non-disulfide-compatible side chains), allowing
  it to fold and function in the reducing cytoplasm rather than only the
  oxidizing periplasm/ER. **No biologically relevant ligand** is present —
  SO4 is a crystallographic additive. This entry tests the
  designed-protein / engineered-scaffold analysis path.

