pdb: ma-rgcer
short_name: "De novo designed coiled-coil with diversified heptad repeats"
description: |
  An 83-residue de novo designed protein — a four-helix-bundle coiled-coil
  fold in which the heptad repeat pattern is deliberately diversified across
  helices. The hydrophobic core positions (a and d in the heptad) carry
  L/V/I/A/F/W; surface positions carry charged residues. Single chain,
  fully helical (~94% helix). Designed computationally; structure deposited
  in ModelArchive (DOI 10.5452/ma-rgcer) as an AlphaFold-quality predicted
  model with pLDDT in the B-factor column. No biological / functional role
  — pure structural design.

