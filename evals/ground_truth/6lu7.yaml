pdb: 6lu7
short_name: "SARS-CoV-2 main protease (3CLpro) + peptidic inhibitor"
description: |
  SARS-CoV-2 main protease (Mpro / 3CLpro), the chymotrypsin-like
  cysteine protease that cleaves the viral polyprotein at 11 sites.
  Functional unit is an obligate homodimer (~306 aa per protomer);
  monomers are inactive. Catalytic dyad: Cys145 (nucleophile) - His41
  (general base). Two β-barrel domains plus a C-terminal α-helical
  domain involved in dimerization. Major COVID-19 drug target —
  nirmatrelvir (Paxlovid) is the clinically successful Mpro inhibitor.
  This entry is in complex with a peptide-mimetic inhibitor.

identity:
  must_mention_one_of:
    - "main protease"
    - "Mpro"
    - "3CL"
    - "3CLpro"
    - "SARS"
    - "coronavirus protease"
  reference_phrase: "SARS-CoV-2 main protease — chymotrypsin-like cysteine protease, dimer with Cys145-His41 dyad"

oligomeric_state:
  correct: dimer
  acceptable: ["dimer", "homodimer", "obligate dimer", "2-mer"]
  symmetry: C2
  required_caveat: "Must distinguish that the 6LU7 asymmetric unit contains a single SARS-CoV-2 Mpro chain (the dimer is generated by crystallographic symmetry), even though the enzyme is functional only as an obligate homodimer."

fold_class:
  must_mention_one_of:
    - "chymotrypsin fold"
    - "chymotrypsin-like"
    - "β-barrel"
    - "trypsin-like"

active_site:
  type: dyad
  catalytic_residues:
    - {name: CYS145, role: "nucleophile"}
    - {name: HIS41, role: "general base"}
  mechanism_class: hydrolase
  location: intra-subunit

cofactors_metals_ligands:
  expected: []
  bio_ligand: "peptidic inhibitor (N3 or similar)"

notable_features:
  must_mention_one_of:
    - "Cys-His dyad"
    - "cysteine protease"
    - "obligate dimer"
    - "chymotrypsin-like"
    - "Cys145"
    - "His41"

negative_constraints:
  - "must not call it a serine protease"
  - "must not claim it's a metalloprotease"
  - "must not invoke a Ser-His-Asp triad"

inference_hygiene:
  required: false
