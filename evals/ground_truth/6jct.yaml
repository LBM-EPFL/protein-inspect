pdb: 6jct
short_name: "Adeno-associated virus 5 (AAV5) capsid at neutral pH"
description: |
  6JCT is a cryo-EM structure of the AAV5 (Adeno-associated virus 5)
  icosahedral capsid at 3.18 Å resolution, solved in a neutral-pH
  state. AAV5 is one of the major adeno-associated virus serotypes used
  in gene-therapy vector design (the Sarepta / Spark / Roche AAV gene
  therapies use related serotypes). The capsid is composed of 60 copies
  of the VP3 protein (with smaller fractions of VP1/VP2 N-terminal
  extensions) arranged with icosahedral T=1 symmetry. Each subunit
  adopts the conserved parvovirus capsid β-jelly-roll fold (8-stranded
  antiparallel β-barrel). Tests viral-capsid recognition + cryo-EM
  symmetric assembly.

identity:
  must_mention_one_of:
    - "AAV"
    - "AAV5"
    - "adeno-associated virus"
    - "viral capsid"
    - "parvovirus capsid"
  reference_phrase: "AAV5 viral capsid — icosahedral parvovirus assembly"

oligomeric_state:
  correct: higher_order
  acceptable:
    - "higher_order"
    - "icosahedral capsid"
    - "60-mer"
    - "T=1 icosahedron"
  symmetry: I
  required_caveat: "Must distinguish that the biological assembly is the full 60-subunit icosahedron generated by I-point-group symmetry, even though the asymmetric unit may contain only a single VP3 subunit."

fold_class:
  must_mention_one_of:
    - "β-jelly roll"
    - "jelly roll"
    - "parvovirus capsid fold"
    - "8-stranded β-barrel"
    - "viral capsid fold"

active_site:
  type: none
  catalytic_residues: []
  mechanism_class: none
  location: surface

cofactors_metals_ligands:
  expected: []
  bio_ligand: null

notable_features:
  must_mention_one_of:
    - "icosahedral"
    - "T=1"
    - "VP3"
    - "parvovirus"
    - "gene therapy"
    - "AAV"
    - "jelly roll"
    - "cryo-EM"

negative_constraints:
  - "must NOT call it an enzyme"
  - "must NOT confuse with adenovirus (different family — adeno-associated viruses are PARVOVIRUSES, dependoparvovirus genus)"
  - "must NOT claim a catalytic mechanism"

inference_hygiene:
  required: false
