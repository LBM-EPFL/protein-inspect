pdb: 3grs
short_name: "Glutathione reductase (FAD-dependent, disulfide oxidoreductase)"
description: |
  Human glutathione reductase — flavoenzyme that reduces glutathione
  disulfide (GSSG) to its reduced form (GSH) using NADPH as electron
  source. Homodimer (~478 aa per chain). FAD prosthetic group is
  non-covalently bound deep in the protein. The reaction proceeds via
  a redox-active disulfide (Cys58-Cys63) that transfers electrons from
  FAD to GSSG. Member of the "pyridine nucleotide-disulfide
  oxidoreductase" family. Two Rossmann-fold domains: one binds FAD, one
  binds NADPH; plus an interface domain.

identity:
  must_mention_one_of:
    - "glutathione reductase"
    - "GR"
    - "GSR"
  reference_phrase: "Glutathione reductase — FAD-dependent NADPH-driven disulfide oxidoreductase"

oligomeric_state:
  correct: dimer
  acceptable: ["dimer", "homodimer"]
  symmetry: C2
  required_caveat: "Must distinguish that the 3GRS asymmetric unit may contain a single glutathione reductase chain (the second subunit is generated by crystallographic symmetry), even though the functional enzyme is a homodimer."

fold_class:
  must_mention_one_of:
    - "Rossmann fold"
    - "two Rossmann"
    - "pyridine nucleotide disulfide oxidoreductase"
    - "α/β"

active_site:
  type: dyad
  catalytic_residues:
    - {name: CYS58, role: "redox-active disulfide partner"}
    - {name: CYS63, role: "redox-active disulfide partner"}
    - {name: HIS467, role: "general acid/base (from neighboring subunit)"}
  mechanism_class: oxidoreductase
  location: inter-subunit

cofactors_metals_ligands:
  expected:
    - {id: FAD, chemistry_class: redox_1e_or_2e}
  bio_ligand: "FAD (and NADPH in some entries)"

notable_features:
  must_mention_one_of:
    - "FAD"
    - "flavin"
    - "redox-active disulfide"
    - "Rossmann"
    - "two domains"
    - "GSSG reduction"

negative_constraints:
  - "must not claim heme cofactor"
  - "must not call it a protease"
  - "must not call it a kinase"

inference_hygiene:
  required: false
