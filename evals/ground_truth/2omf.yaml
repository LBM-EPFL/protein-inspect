pdb: 2omf
short_name: "E. coli OmpF porin (β-barrel outer-membrane protein)"
description: |
  OmpF from E. coli — outer-membrane porin allowing passive diffusion
  of small hydrophilic molecules (<600 Da) across the outer membrane.
  Functional homotrimer (~340 aa per subunit), each monomer a
  16-stranded antiparallel β-barrel. Aromatic girdle of Tyr/Trp at
  both ends of the barrel anchors it in the lipid bilayer. The "L3
  loop" folds inward to constrict the channel, providing weak ion
  selectivity. Archetypal example of a non-specific outer-membrane
  β-barrel porin.

identity:
  must_mention_one_of:
    - "OmpF"
    - "porin"
    - "outer membrane protein"
    - "outer-membrane porin"
  reference_phrase: "OmpF — bacterial outer-membrane 16-stranded β-barrel porin"

oligomeric_state:
  correct: trimer
  acceptable: ["trimer", "homotrimer"]
  symmetry: C3
  required_caveat: "Must distinguish that the 2OMF asymmetric unit contains a single OmpF chain (the trimer is generated by crystallographic symmetry), even though the biological assembly is a homotrimer in the outer membrane."

fold_class:
  must_mention_one_of:
    - "β-barrel"
    - "16-stranded β-barrel"
    - "outer-membrane β-barrel"
    - "porin fold"

active_site:
  type: none
  catalytic_residues: []
  mechanism_class: none
  location: pocket

cofactors_metals_ligands:
  expected: []
  bio_ligand: null

notable_features:
  must_mention_one_of:
    - "β-barrel"
    - "porin"
    - "L3 loop"
    - "aromatic girdle"
    - "outer membrane"
    - "Trp"
    - "Tyr"
    - "passive diffusion"
    - "nonspecific channel"
    - "nonspecific porin"

negative_constraints:
  - "must not call it an α-helical membrane protein"
  - "must not call it an enzyme"
  - "must not claim a catalytic site"

inference_hygiene:
  required: false
