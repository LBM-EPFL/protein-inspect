name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      # Deterministic gate: exclude `network` tests (hit RCSB/PDB, inherently
      # flaky in CI) and `slow` tests. PyMOL integration tests self-skip when
      # no claudemol socket is listening on port 9880 — which is the case on
      # the runner — so they don't need PyMOL installed.
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -m "not network and not slow"
